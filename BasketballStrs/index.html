<!DOCTYPE html>
<html lang="en">
<head>
    <base href="https://cdn.jsdelivr.net/gh/Sharkii14/sharkii-games@main/BasketballStrs/">
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no">    
    <title>Basketball Legends</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            background: #000;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #content {
            width: 100%;
            height: 100%;
        }
        #loader {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #fff;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: #000;
        }
    </style>
    <link rel="stylesheet" href="assets/css/app.css" type="text/css">
</head>
<body>
    <div id="content"></div>
    <div id="loader">Loading ...</div>
    
    <script>
        // Setup global environment BEFORE any game scripts load
        window.CrazyGames = {
            SDK: {
                ad: {
                    requestAd: function() {},
                    onCompleted: function(cb) { if(cb) cb(); },
                    onSkipped: function(cb) { if(cb) cb(); },
                    onError: function(cb) { if(cb) cb(); }
                },
                init: function() {},
                setDebug: function() {}
            }
        };
        
        // Create game stub that libraries can attach to
        window.game = null;
        window.PhaserCachebuster = {};
        
        // Prevent undefined errors
        window.ig = window.ig || {};
        
        // Hide loader when game starts
        var hideLoader = function() {
            var loader = document.getElementById('loader');
            if (loader) {
                loader.style.display = 'none';
            }
        };
        
        // Wait a moment then hide loader
        setTimeout(hideLoader, 2000);
    </script>
    
    <script type="text/javascript" src="assets/lib/nape.min.js?v=1"></script>
    <script type="text/javascript" src="assets/lib/phaser.min.js?v=1"></script>
    <script type="text/javascript" src="assets/lib/phaser-super-storage.min.js?v=1"></script>
    <script type="text/javascript" src="assets/lib/dragonBones.min.js?v=1"></script>
    <script type="text/javascript" src="basketball_legends_2019.min.js?v=1"></script>
</body>
</html>
