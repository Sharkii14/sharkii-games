<!DOCTYPE html>
<html lang="en">
<head>

<base href="https://cdn.jsdelivr.net/gh/Sharkii14/sharkii-games@main/BBS/">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Basketball Stars</title>

<link rel="stylesheet" href="assets/css/app.css">

<style>
html, body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

#gameContainer{
width:100%;
height:100%;
}

canvas{
display:block;
margin:auto;
}
</style>

</head>

<body>

<div id="gameContainer"></div>

<script src="assets/box2dweb/nape.min.js"></script>
<script src="assets/box2dweb/nape-debug-draw.min.js"></script>
<script src="assets/box2dweb/jquery-3.1.1.min.js"></script>
<script src="assets/box2dweb/easeljs-0.8.2.combined.js"></script>
<script src="assets/box2dweb/bluebird.min.js"></script>

<script>

var useEvents = (typeof(Event) === "function");

function dispatchGameEvent(name){
    var event;

    if(useEvents){
        event = new Event(name);
    }else{
        event = document.createEvent("Event");
        event.initEvent(name,true,true);
    }

    document.getElementById("gameContainer").dispatchEvent(event);
}

window.GD_OPTIONS = {
    gameId:"local",
    onEvent:function(event){

        switch(event.name){

            case "SDK_GAME_START":
                dispatchGameEvent("SDK_GAME_START");
                break;

            case "SDK_GAME_PAUSE":
                dispatchGameEvent("SDK_GAME_PAUSE");
                break;

            case "SDK_READY":
                console.log("Game ready");
                break;

        }

    }
};

</script>

<script src="basketball_legends_2019.min.js"></script>

</body>
</html>
